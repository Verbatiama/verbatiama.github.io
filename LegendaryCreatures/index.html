<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Legendary Creatures</title>
  </head>
  <script type="text/javascript" src="index.js"></script>
  <script src="https://code.highcharts.com/highcharts.js"></script>
  <link
    rel="stylesheet"
    type="text/css"
    href="https://code.highcharts.com/css/highcharts.css"
  />
  <link href="index.css" rel="stylesheet" type="text/css" />

  <body>
    <button
      id="menuToggle"
      aria-label="Menu"
      aria-expanded="false"
      aria-controls="menu"
      onclick="toggleMenu()"
    >
      &#9776;
    </button>
    <nav id="menu" onclick="if (event.target.closest('button')) toggleMenu(false)">
      <button onclick="fetchData(displayCocktail, (data) => true)">Full</button>
      <button onclick="fetchData(displayCocktail, (data) => data.Owned == '0')">
        Not Owned
      </button>
      <button onclick="copySelectedText()">Copy</button>
      <button onclick="toggleSelectAll()">Select all</button>
      <button id="toggleLocation" onclick="toggleLocationColumns()">
        Hide location
      </button>
    </nav>
    <script>
      function toggleMenu(open) {
        const menu = document.getElementById("menu");
        const isOpen = menu.classList.toggle("open", open);
        document
          .getElementById("menuToggle")
          .setAttribute("aria-expanded", isOpen);
      }
      document.addEventListener("click", (e) => {
        if (!e.target.closest("#menu, #menuToggle")) toggleMenu(false);
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") toggleMenu(false);
      });
    </script>
    <a
      href="/"
      style="
        position: fixed;
        top: 8px;
        left: 12px;
        z-index: 30;
        font:
          14px system-ui,
          sans-serif;
        color: #c2410c;
        text-decoration: none;
      "
      >&larr; Adam Henderson</a
    >
    <button
      id="scrollJump"
      onclick="scrollJump()"
      style="
        position: fixed;
        top: 4px;
        right: 12px;
        z-index: 10;
        font:
          14px system-ui,
          sans-serif;
        color: #c2410c;
        background: none;
        border: none;
        cursor: pointer;
      "
    >
      &darr; Bottom
    </button>
    <script>
      function atTop() {
        return window.scrollY < 10;
      }
      function scrollJump() {
        window.scrollTo({
          top: atTop() ? document.documentElement.scrollHeight : 0,
          behavior: "smooth",
        });
      }
      window.addEventListener("scroll", () => {
        document.getElementById("scrollJump").innerHTML = atTop()
          ? "&darr; Bottom"
          : "&uarr; Top";
      });
    </script>
    <h1 style="text-align: center">Adam's Legendary Creatures</h1>
    <div style="text-align: center" class="container">
      <div class="content">
        <div>
          <p><span id="currentCards"></span></p>
        </div>
        <table id="apiTable" class="styled-table">
          <!-- The table content will be dynamically generated -->
        </table>
      </div>

      <div id="container" class="content">
        <div id="pie-chart-container1"></div>
        <div id="pie-chart-container2"></div>
      </div>
    </div>
  </body>
</html>
